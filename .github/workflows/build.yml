name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Collect APK
        run: cp app/build/outputs/apk/release/app-release.apk QS-Widget.apk

      - uses: actions/upload-artifact@v4
        with:
          name: QS-Widget-apk
          path: QS-Widget.apk

      - name: Publish "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --cleanup-tag --yes || true
          gh release create apk-latest QS-Widget.apk \
            --target "$GITHUB_SHA" \
            --title "QS Widget (ultima build)" \
            --notes "APK compilato automaticamente dal branch ${GITHUB_REF_NAME} (commit ${GITHUB_SHA::7}). Scarica QS-Widget.apk dal telefono e installalo."
